name: amlens-demo
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["serve", "--addr", "0.0.0.0:8000", "--demo"]
    environment:
      ANALYSIS_DATABASE: /var/lib/amlens/demo.db
    volumes:
      - demo-analyses:/var/lib/amlens
    read_only: true
    tmpfs:
      - /tmp:size=384m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    stop_grace_period: 15s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${DEMO_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /data:uid=10001,gid=10001
      - /config:uid=10001,gid=10001
      - /tmp:uid=10001,gid=10001
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  demo-analyses:
