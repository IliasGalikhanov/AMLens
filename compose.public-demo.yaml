# Use only with compose.demo.yaml. Requires Docker Compose 2.24.4+.
services:
  frontend:
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the demo hostname}
    ports: !override
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - ./deploy/Caddyfile.public-demo:/etc/caddy/Caddyfile:ro
      - demo-caddy-data:/data
      - demo-caddy-config:/config
    tmpfs: !override
      - /tmp:uid=10001,gid=10001
volumes:
  demo-caddy-data:
  demo-caddy-config:
